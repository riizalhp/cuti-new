<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="workshopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="workshopGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#workshopBg)" />
  <rect width="800" height="500" fill="url(#workshopGrid)" />
  <circle cx="400" cy="210" r="150" fill="#F59E0B" opacity="0.3" filter="blur(50px)" />
  
  <g transform="translate(350, 140)">
    <rect x="0" y="0" width="100" height="90" rx="16" fill="rgba(69, 26, 3, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    <!-- Clipboard & Pen Icon -->
    <rect x="25" y="24" width="50" height="48" rx="8" fill="url(#amberAccent)" opacity="0.9" />
    <rect x="35" y="16" width="30" height="12" rx="4" fill="#FFFFFF" />
    <line x1="33" y1="38" x2="67" y2="38" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
    <line x1="33" y1="48" x2="67" y2="48" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
    <line x1="33" y1="58" x2="55" y2="58" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
  </g>

  <g transform="translate(400, 310)">
    <rect x="-135" y="0" width="270" height="32" rx="16" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">WORKSHOP &amp; CV CLINIC</text>
  </g>
  <text x="400" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="rgba(255, 255, 255, 0.75)" text-anchor="middle">Praktik Bedah CV &amp; Simulasi Interview</text>
</svg>
