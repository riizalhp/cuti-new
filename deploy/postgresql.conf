# =============================================================================
# Employr — PostgreSQL config untuk 2GB shared VPS
# =============================================================================
# VPS total: 4GB, shared dengan sistem lain. Budget PostgreSQL: ~700-800MB.
# Diasumsikan <10.000 concurrent users, <30 connections aktif.
# =============================================================================

# --- Memory ---
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 8MB

# --- Connections ---
max_connections = 30

# --- Planner ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- WAL / Checkpoint ---
checkpoint_completion_target = 0.9
wal_level = minimal
max_wal_senders = 0

# --- Logging (minimal untuk hemat disk I/O) ---
log_min_duration_statement = 1000
log_statement = 'none'
log_connections = off
log_disconnections = off

# --- Locale ---
timezone = 'Asia/Jakarta'
lc_messages = 'C'
