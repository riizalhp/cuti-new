<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="articleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#3F3F46" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#articleBg)" />

  <!-- Central Editorial Icon -->
  <g transform="translate(350, 140)">
    <rect x="0" y="0" width="100" height="92" rx="16" fill="rgba(39, 39, 42, 0.9)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    <path d="M22 30 H78" stroke="url(#roseAccent)" stroke-width="3" stroke-linecap="round" />
    <path d="M22 46 H62" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M22 62 H72" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Label Badge -->
  <g transform="translate(400, 310)">
    <rect x="-110" y="0" width="220" height="32" rx="16" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PANDUAN &amp; ARTIKEL</text>
  </g>

  <text x="400" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Tips Karier, CV, &amp; Wawancara Kerja</text>
</svg>
