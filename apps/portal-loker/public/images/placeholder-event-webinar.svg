<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="webinarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="indigoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <pattern id="webinarGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#webinarBg)" />
  <rect width="800" height="500" fill="url(#webinarGrid)" />
  <circle cx="400" cy="210" r="150" fill="#6366F1" opacity="0.35" filter="blur(50px)" />
  
  <g transform="translate(350, 140)">
    <rect x="0" y="0" width="100" height="90" rx="16" fill="rgba(30, 27, 75, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    <!-- Video / Presentation Icon -->
    <rect x="18" y="24" width="46" height="36" rx="8" fill="url(#indigoAccent)" opacity="0.9" />
    <path d="M64 34 L82 24 V60 L64 50 Z" fill="url(#indigoAccent)" />
    <circle cx="41" cy="42" r="7" fill="#FFFFFF" opacity="0.9" />
  </g>

  <g transform="translate(400, 310)">
    <rect x="-115" y="0" width="230" height="32" rx="16" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">WEBINAR INTERAKTIF</text>
  </g>
  <text x="400" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="rgba(255, 255, 255, 0.75)" text-anchor="middle">Sesi Mentoring &amp; Tanya Jawab Langsung</text>
</svg>
