<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Employr Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #E2E8F0;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background-color: #1738D1;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      color: #0F172A;
    }
    .desc {
      font-size: 11px;
      color: #64748B;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .btn-primary {
      width: 100%;
      background-color: #1738D1;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 6px -1px rgba(23, 56, 209, 0.2);
      transition: background 0.15s;
    }
    .btn-primary:hover {
      background-color: #132EA8;
    }
    .settings {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed #CBD5E1;
    }
    .settings label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #64748B;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .settings input {
      width: 100%;
      padding: 6px 8px;
      font-size: 11px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      background: white;
      color: #0F172A;
    }
    .status-msg {
      font-size: 11px;
      color: #059669;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">E</div>
    <div>
      <div class="title">Employr Assistant</div>
      <div style="font-size: 10px; color: #059669; font-weight: 600;">● Aktif di LinkedIn</div>
    </div>
  </div>

  <p class="desc">
    Buka profil LinkedIn siapa saja, lalu klik tombol di bawah (atau tombol melayang di pojok kanan LinkedIn) untuk menganalisis profil ke Employr.
  </p>

  <button id="scrape-btn" class="btn-primary">
    ⚡ Ekstrak Profil Tab Ini
  </button>

  <div id="status-text" class="status-msg">Berhasil diekstrak! Membuka...</div>

  <div class="settings">
    <label for="employr-url">Alamat Dashboard Employr:</label>
    <input type="text" id="employr-url" value="http://localhost:3000">
  </div>

  <script src="popup.js"></script>
</body>
</html>
