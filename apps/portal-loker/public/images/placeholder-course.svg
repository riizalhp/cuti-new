<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="courseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <pattern id="courseDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#courseBg)" />
  <rect width="800" height="500" fill="url(#courseDots)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="210" r="150" fill="#3B82F6" opacity="0.25" filter="blur(50px)" />

  <!-- Central Code / Skill Terminal Icon -->
  <g transform="translate(350, 140)">
    <rect x="0" y="0" width="100" height="90" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    <path d="M0 24 H100" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <circle cx="16" cy="12" r="3.5" fill="#EF4444" />
    <circle cx="28" cy="12" r="3.5" fill="#F59E0B" />
    <circle cx="40" cy="12" r="3.5" fill="#10B981" />
    <!-- Code Brackets -->
    <path d="M36 44 L26 56 L36 68" stroke="url(#cyanAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M64 44 L74 56 L64 68" stroke="url(#cyanAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M54 40 L46 72" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Label Badge -->
  <g transform="translate(400, 310)">
    <rect x="-115" y="0" width="230" height="32" rx="16" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PELATIHAN &amp; SKILL</text>
  </g>

  <text x="400" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Kurikulum Terarah Kebutuhan Industri</text>
</svg>
